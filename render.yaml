services:
  - type: web
    name: unit-back
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUSKY
        value: '0'
      - key: DATABASE_URL
        fromDatabase:
          name: unit-db
          property: connectionString

databases:
  - name: unit-db
    plan: free
